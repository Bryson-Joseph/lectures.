<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Friends - Kokoa Talk</title>
    <link rel="stylesheet" href="styles/styles.css" />
</head>

<body>
    <div class="status-bar">
        <div class="status-bar-column">
            <span>No service</span>
            <i class="fa-solid fa-wifi"></i>
        </div>
        <div class="status-bar-column">
            <span>18:43</span>
        </div>
        <div class="status-bar-column">
            <span>100%</span>
            <i class="fa-solid fa-battery-full"></i>
            <i class="fa-solid fa-bolt"></i>
        </div>
    </div>
    <header class="screen-header">
        <h1 class="screen-header__title">Chats</h1>
        <div class="screen-header__icons">
            <span><i class="fa-solid fa-magnifying-glass fa-lg"></i></span>
            <span><i class="fa-solid fa-comment-dots fa-lg"></i></span>
            <span><i class="fa-solid fa-music fa-lg"></i></span>
            <span><i class="fa-solid fa-gear fa-lg"></i></span>
        </div>
    </header>

    <main class="main-screen">
        <div class="user-components">
            <div class="user-component__column">
                <img src="img/avatar.jpeg" class="user-component__avatar user-component__avatar" />
                <div class="user-component__text">
                    <h4 class="user-component__title">KakaoTalk</h4>
                    <h6 class="user-component__subtitle">Please check My Kakao Account info</h6>
                </div>
            </div>
            <div class="user-component__column">
                <span class="user-component__time">21:22</span>
                <div class="badge">1
                </div>
            </div>
        </div>
    </main>

    <nav class=" nav ">
        <ul class="nav__list ">
            <li class="nav__btn ">
                <a class="nav__link " href="friends.html "><i class="fa-regular fa-user fa-2x "></i></a>
            </li>
            <li class="nav__btn ">
                <a class="nav__link " href="chats.html ">
                    <span class="nav__notification badge ">1</span>
                    <i class="fa-solid fa-comment fa-2x "></i>
                </a>
            </li>
            <li class="nav__btn ">
                <a class="nav__link " href="find.html "><i class="fa-solid fa-magnifying-glass fa-2x "></i
          ></a>
            </li>
            <li class="nav__btn ">
                <a class="nav__link fa-no-style " href="More.html "><i class="fa-solid fa-ellipsis fa-2x "></i
          ></a>
            </li>
        </ul>
    </nav>

    <script src="https://kit.fontawesome.com/8f81586e06.js " crossorigin="anonymous "></script>
</body>

</html>
