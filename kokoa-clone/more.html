<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>More - Kokoa Talk</title>
    <link rel="stylesheet" href="styles/styles.css" />
</head>

<body>
    <div class="status-bar">
        <div class="status-bar-column">
            <span>No service</span>
            <i class="fa-solid fa-wifi"></i>
        </div>
        <div class="status-bar-column">
            <span>21:43</span>
        </div>
        <div class="status-bar-column">
            <span>100%</span>
            <i class="fa-solid fa-battery-full"></i>
            <i class="fa-solid fa-bolt"></i>
        </div>
    </div>
    <header class="screen-header">
        <h1 class="screen-header__title">More</h1>
        <div class="screen-header__icons">
            <span><i class="fas fa-magnifying-glass fa-lg"></i></span>
            <span><i class="fa-solid fa-music fa-lg"></i></span>
            <span><i class="fas fa-gear fa-lg"></i></span>
        </div>
    </header>

    <main class="main-screen more-screen">
        <div class="user-components">
            <div class="user-component__column">
                <img src="img/avatar.jpeg" class="user-component__avatar user-component__avatar" />
                <div class="user-component__text">
                    <h4 class="user-component__title">Jeffrey</h4>
                    <h6 class="user-component__subtitle">+255 762 310 529</h6>
                </div>
            </div>
            <div class="user-component__column"><i class="fa-regular fa-message fa-lg"></i>
            </div>
        </div>
        </div>

        <div class="icon-row">
            <div class="icon-row__icon"><i class="fa-regular fa-calendar"></i>
                <span>Calendar</span>
            </div>
            <div class="icon-row__icon"><i class="fa-solid fa-briefcase" style="color: #df1616"></i>
                <span>Talk Drive</span>
            </div>
            <div class="icon-row__icon"><i class="fa-regular fa-face-meh" style="color: gold"></i>
                <span>Emotions</span>
            </div>
            <div class="icon-row__icon"><i class="fa-solid fa-brush fa-rotate-180" style="color: #dfd816">
                </i><span>Themes</span>
            </div>
            <div class="icon-row__icon"><i class="fa-solid fa-users-rectangle" style="color: #48df16"></i><span>Account</span>
            </div>
            <div class="icon-row__icon"><i class="fa-solid fa-comments" style="color: #2e2d16"></i><span>Openchat</span>
            </div>


        </div>
        <div class="more-suggestions">
            <h5 class="more-suggestions__title">Suggestions</h5>
            <div class="more-suggestions__icons">
                <div class="more-suggestions__icon">
                    <!-- <h5 class="open-post__title">#BTS</h5>
                    <h6 class="open-post__hashtags">#bts#army#friends</h6> -->
                    <div class="more-suggestions__icon-image">
                        <i class="fa-solid fa-quote-right"></i>

                        <span class="more-suggestion__icon-text">Kokoa Story</span>
                    </div>
                    <div class="more-suggestions__icon-image">
                        <i class="fa-solid fa-quote-right"></i>

                        <span class="more-suggestion__icon-text">Kokoa Story</span>
                    </div>

                </div>

            </div>
        </div>

    </main>

    <nav class=" nav ">
        <ul class="nav__list ">
            <li class="nav__btn ">
                <a class="nav__link " href="friends.html "><i class="far fa-user fa-2x "></i
          ></a>
            </li>
            <li class="nav__btn ">
                <a class="nav__link " href="chats.html ">
                    <span class="nav__notification badge ">1</span>
                    <i class="far fa-comment fa-2x "></i>
                </a>
            </li>
            <li class="nav__btn ">
                <a class="nav__link " href="find.html "><i class="fa-solid fa-magnifying-glass fa-2x "></i
          ></a>
            </li>
            <li class="nav__btn ">
                <a class="nav__link fa-no-style " href="More.html "><i class="fa-solid fa-ellipsis fa-2x "></i
          ></a>
            </li>
        </ul>
    </nav>

    <script src="https://kit.fontawesome.com/8f81586e06.js " crossorigin="anonymous "></script>
</body>

</html>
