<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Friends - Kokoa Talk</title>
    <link rel="stylesheet" href="styles/styles.css" />
</head>

<body>
    <div class="status-bar">
        <div class="status-bar-column">
            <span>No service</span>
            <i class="fa-solid fa-wifi"></i>
        </div>
        <div class="status-bar-column">
            <span>18:43</span>
        </div>
        <div class="status-bar-column">
            <span>100%</span>
            <i class="fa-solid fa-battery-full"></i>
            <i class="fa-solid fa-bolt"></i>
        </div>
    </div>
    <header class="screen-header">
        <h1 class="screen-header__title">Friends</h1>
        <div class="screen-header__icons">
            <span><i class="fa-solid fa-magnifying-glass fa-lg"></i></span>
            <span><i class="fa-solid fa-music fa-lg"></i></span>
            <span><i class="fa-solid fa-gear fa-lg"></i></span>
        </div>

    </header>


    <a id="friends-display-link">
        <i class="fa-solid fa-circle-info" style="color: #aeb0b2;"></i>Friends' Names Display<i class="fa-solid fa-chevron-right fa-xs" style="color: #9fa8b7;"></i>
    </a>
    <main class="friends-screen">
        <div class="user-components">
            <div class="user-component__column">
                <img src="img/avatar.jpeg" class="user-component__avatar user-component__avatar--sm" />
                <div class="user-component__text">
                    <h4 class="user-component__title">Jeffrey</h4>
                </div>
            </div>

            <div class="friends-screen__channel">
                <div class="friends-screen__channel-header">
                    <span>Channel</span><i class="fa-solid fa-chevron-up fa-xs" style="color: #9fa8b7;"></i>
                </div>
            </div>
            <div class="user-component__column">
                <img src="img/avatar.jpeg" class="user-component__avatar user-component__avatar--sm" />
                <div class="user-component__text">
                    <h4 class="user-component__title">Channel</h4>
                </div>
            </div>
            <div class="user-component__column">
                <span>2</span>
                <i class="fa-solid fa-chevron-right fa-xs" style="color: #9fa8b7;"></i>
            </div>
        </div>
        </div>
    </main>

    <nav class=" nav ">
        <ul class="nav__list ">
            <li class="nav__btn ">
                <a class="nav__link " href="friends.html "><i class="fa-solid fa-user fa-lg "></i></a>
            </li>
            <li class="nav__btn ">
                <a class="nav__link " href="# ">
                    <span class="nav__notification ">1</span>
                    <i class="fa-regular fa-comment fa-lg "></i></a>
            </li>
            <li class="nav__btn ">
                <a class="nav__link " href="# "><i class="fa-solid fa-magnifying-glass fa-lg "></i></a>
            </li>
            <li class="nav__btn ">
                <a class="nav__link fa-no-style " href="# "><i class="fa-solid fa-ellipsis fa-lg "></i></a>
            </li>
        </ul>
    </nav>

    <script src="https://kit.fontawesome.com/8f81586e06.js " crossorigin="anonymous "></script>

</body>

</html>
