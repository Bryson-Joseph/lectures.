<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Find - Kokoa Talk</title>
    <link rel="stylesheet" href="styles/styles.css" />
</head>

<body>
    <div class="status-bar">
        <div class="status-bar-column">
            <span>No service</span>
            <i class="fa-solid fa-wifi"></i>
        </div>
        <div class="status-bar-column">
            <span>21:43</span>
        </div>
        <div class="status-bar-column">
            <span>100%</span>
            <i class="fa-solid fa-battery-full"></i>
            <i class="fa-solid fa-bolt"></i>
        </div>
    </div>
    <header class="screen-header">
        <h1 class="screen-header__title">Find</h1>
        <div class="screen-header__icons">
            <span><i class="fas fa-magnifying-glass fa-lg"></i></span>
            <span><i class="fas fa-gear fa-lg"></i></span>
        </div>
    </header>

    <main class="main-screen">
        <div class="find-icons">
            <div class="find-icons__icon">
                <i class="fa-solid fa-qrcode"></i>
                <span>QR Code</span>
            </div>
            <div class="find-icons__icon">
                <i class="fa-solid fa-address-book" style="color: #df1616"></i>
                <span>Add by Contacts</span>
            </div>
            <div class="find-icons__icon">
                <i class="fa-solid fa-fingerprint" style="color: #16df48"></i>
                <span>Add by ID</span>
            </div>
            <div class="find-icons__icon">
                <i class="fa-regular fa-envelope" style="color: #dfd816">
                </i><span>Invite</span>
            </div>
        </div>
        <div class="recommended-friends">
            <h6 class="recommended-friends__title">Recommended Friends
            </h6>
            <span>You have no recommended friends.</span>
        </div>
        <div class="open-chat">
            <div class="open-chat__header">
                <h6>Open Chat</h6>
                <span>Go to Openchat Home</span>
                <i class="fa-solid fa-chevron-right fa-xs" style="color: #9fa8b7">
                </i>
            </div>
        </div>
    </main>

    <nav class=" nav ">
        <ul class="nav__list ">
            <li class="nav__btn ">
                <a class="nav__link " href="friends.html "><i class="far fa-user fa-2x "></i
          ></a>
            </li>
            <li class="nav__btn ">
                <a class="nav__link " href="chats.html ">
                    <span class="nav__notification badge ">1</span>
                    <i class="far fa-comment fa-2x "></i>
                </a>
            </li>
            <li class="nav__btn ">
                <a class="nav__link " href="find.html "><i class="fa-solid fa-magnifying-glass fa-2x "></i
          ></a>
            </li>
            <li class="nav__btn ">
                <a class="nav__link fa-no-style " href="More.html "><i class="fa-solid fa-ellipsis fa-2x "></i
          ></a>
            </li>
        </ul>
    </nav>

    <script src="https://kit.fontawesome.com/8f81586e06.js " crossorigin="anonymous "></script>
</body>

</html>
