<!DOCTYPE html>
<html>
  <body>
    <div id="root"></div>
  </body>
  <script src="https://www.unpkg.com/react@16.7.0/umd/react.production.min.js"></script>
  <script src="https://www.unpkg.com/react-dom@16.7.0/umd/react-dom.production.min.js"></script>
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
  <script type="text/babel">
    const root = document.getElementById('root') let counter = 0; function countUp() { setCount(count + 1) } const Container = () => (
    <div>
        <h3>Total clicks: {count}</h3>
        <button onClick={countUp}>Click me</button>
    </div>
    ); ReactDOM.render(

    <Counter />, root)
  </script>
</html>
